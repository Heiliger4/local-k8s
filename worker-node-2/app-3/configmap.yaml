apiVersion: v1
kind: ConfigMap
metadata:
  name: app-3-config
  namespace: web-lab
data:
  SERVICE_NAME: "app-3"
  PORT: "8083"














# Specifies the core Kubernetes v1 API version for ConfigMap resources
# apiVersion: v1

# Tells Kubernetes what resource object to create (ConfigMap: holds non-sensitive configuration)
# kind: ConfigMap

# Metadata contains naming and namespace scope information for this ConfigMap
# metadata:

# Unique name of this ConfigMap object inside the namespace
#   name: app-3-config

# The virtual isolated namespace where this ConfigMap will reside
#   namespace: web-lab

# Data dictionary containing non-sensitive key-value environment variables
# data:

# Environment variable key defining the name of the microservice
#   SERVICE_NAME: "app-3"

# Environment variable key defining the HTTP port the Analytics API listens on
#   PORT: "8083"
